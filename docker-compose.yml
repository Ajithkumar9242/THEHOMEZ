services:
  mongo:
    image: mongo:7.0
    container_name: thehomez-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./docker/init-replica-set.sh:/scripts/init-replica-set.sh:ro
    networks:
      - thehomez-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --host 127.0.0.1:27017 --quiet --eval \"const h = db.runCommand({ hello: 1 }); if (h.isWritablePrimary) quit(0); quit(1);\""
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  mongo-init:
    image: mongo:7.0
    container_name: thehomez-mongo-init
    depends_on:
      mongo:
        condition: service_started
    volumes:
      - ./docker/init-replica-set.sh:/scripts/init-replica-set.sh:ro
    entrypoint: ["bash", "/scripts/init-replica-set.sh"]
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      REPLICA_SET_NAME: rs0
      MAX_WAIT_SECONDS: 60
    networks:
      - thehomez-network
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: thehomez-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      API_PREFIX: /api/v1
      MONGODB_URI: mongodb://mongo:27017/thehomez?replicaSet=rs0
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001,http://localhost:3002
      LOG_LEVEL: info
      JWT_ACCESS_SECRET: dev_thehomez_jwt_access_secret_min_32_characters_1234!
      JWT_ACCESS_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      OTP_PEPPER_SECRET: dev_thehomez_otp_pepper_secret_min_32_characters_9012!
      OTP_TTL_SECONDS: 300
      OTP_RESEND_COOLDOWN_SECONDS: 60
      OTP_MAX_ATTEMPTS: 3
      OTP_PROVIDER: mock
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      AUTH_RATE_LIMIT_MAX_REQUESTS: 10
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - thehomez-network
    profiles:
      - full

volumes:
  mongo_data:
    name: thehomez_mongo_data

networks:
  thehomez-network:
    name: thehomez-network
    driver: bridge
